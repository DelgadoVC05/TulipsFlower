<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulips For You 🌷</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button class="mode-toggle" onclick="toggleMode()">
      <span class="mode-icon">☀️</span>
      <span class="mode-text">Morning</span>
    </button>

    <!-- Romantic Message -->
    <!-- <div class="message">
      <h1>For Someone Special 💕</h1>
      <p>Like tulips blooming in the garden of my heart</p>
    </div> -->

    <!-- Celestial Bodies -->
    <div class="celestial-body sun"></div>
    <div class="celestial-body moon"></div>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Butterflies -->
    <div class="butterfly" style="left: 10%; top: 30%; animation-delay: 0s">
      🦋
    </div>
    <div class="butterfly" style="left: 80%; top: 40%; animation-delay: 5s">
      🦋
    </div>

    <!-- Hearts -->
    <div id="hearts"></div>

    <!-- Container -->
    <div class="container">
      <div class="tulip">
        <div class="stem">
          <div class="tulipHead">
            <div class="tulipHair lightTulip lightTulip-1"></div>
            <div class="tulipHair darkTulip darkTulip-1"></div>
            <div class="tulipHair lightTulip lightTulip-2"></div>
            <div class="tulipHair darkTulip darkTulip-2"></div>
            <div class="tulipHair lightTulip lightTulip-3"></div>
            <div class="tulipFace">
              <div class="tulipSparkle"></div>
              <div class="leftBlush tulipBlush"></div>
              <div class="rightBlush tulipBlush"></div>
            </div>
          </div>
          <div class="rightTulipLeaf tulipLeaf leaf"></div>
          <div class="leftTulipLeaf tulipLeaf leaf"></div>
          <div class="rightStemLeaf stemLeaf leaf"></div>
          <div class="leftStemLeaf stemLeaf leaf"></div>
        </div>
      </div>
      <div class="leftBabyTulip tulip">
        <div class="stem">
          <div class="tulipHead">
            <div class="tulipHair lightTulip lightTulip-1"></div>
            <div class="tulipHair darkTulip darkTulip-1"></div>
            <div class="tulipHair lightTulip lightTulip-2"></div>
            <div class="tulipHair darkTulip darkTulip-2"></div>
            <div class="tulipHair lightTulip lightTulip-3"></div>
            <div class="tulipFace">
              <div class="tulipSparkle"></div>
              <div class="leftBlush tulipBlush"></div>
              <div class="rightBlush tulipBlush"></div>
            </div>
          </div>
          <div class="rightTulipLeaf tulipLeaf leaf"></div>
          <div class="leftTulipLeaf tulipLeaf leaf"></div>
          <div class="rightStemLeaf stemLeaf leaf"></div>
          <div class="leftStemLeaf stemLeaf leaf"></div>
        </div>
      </div>
      <div class="rightBabyTulip tulip">
        <div class="stem">
          <div class="tulipHead">
            <div class="tulipHair lightTulip lightTulip-1"></div>
            <div class="tulipHair darkTulip darkTulip-1"></div>
            <div class="tulipHair lightTulip lightTulip-2"></div>
            <div class="tulipHair darkTulip darkTulip-2"></div>
            <div class="tulipHair lightTulip lightTulip-3"></div>
            <div class="tulipFace">
              <div class="tulipSparkle"></div>
              <div class="leftBlush tulipBlush"></div>
              <div class="rightBlush tulipBlush"></div>
            </div>
          </div>
          <div class="rightTulipLeaf tulipLeaf leaf"></div>
          <div class="leftTulipLeaf tulipLeaf leaf"></div>
          <div class="rightStemLeaf stemLeaf leaf"></div>
          <div class="leftStemLeaf stemLeaf leaf"></div>
        </div>
      </div>
    </div>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Grass -->
    <div class="grass" id="grass"></div>

    <script src="script.js"></script>
  </body>
</html>
